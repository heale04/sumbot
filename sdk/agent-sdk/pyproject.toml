[project]
name = "poker-agent-sdk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["poker-agent-protocol==0.1.0", "poker-engine==0.1.0"]

[project.scripts]
poker-agent = "poker_agent_sdk.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_agent_sdk"]
